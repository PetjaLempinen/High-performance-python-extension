[build-system]
requires = [
    "setuptools>=42.0.0",
    "wheel",
    "cmake>=3.15",
    "pybind11>=2.6.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "pathfinder_ext"
version = "0.1.0"
description = "High-performance C++ A* pathfinder extension for python"
readme = "README.md"
requires-python = ">=3.9"